<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}SimpleStore{% endblock %}</title>
  {% load static %}

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="{% static 'store/style.css' %}"/>
</head>
<body>

  <header class="navbar" id="navbar">
    <a href="{% url 'homepage' %}" class="brand">
      <span class="brand-dot"></span>SimpleStore
    </a>
    <nav class="nav-links">
      <a href="{% url 'homepage' %}" class="nav-item">
        <i class="fa-solid fa-house"></i><span>Home</span>
      </a>
      <a href="{% url 'product_list' %}" class="nav-item">
        <i class="fa-solid fa-grid-2"></i><span>Products</span>
      </a>
      <a href="{% url 'cart' %}" class="nav-cart-btn">
        <i class="fa-solid fa-bag-shopping"></i>
        <span>Cart</span>
      </a>
    </nav>
  </header>

  <main class="page-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-grid">
      <div class="footer-brand-col">
        <p class="footer-logo">SimpleStore</p>
        <p class="footer-tagline">Curated goods.<br>Honest prices.</p>
      </div>
      <div class="footer-links-col">
        <p class="footer-heading">Navigate</p>
        <a href="{% url 'homepage' %}">Home</a>
        <a href="{% url 'product_list' %}">Products</a>
        <a href="{% url 'cart' %}">Cart</a>
        <a href="{% url 'order_form' %}">Checkout</a>
      </div>
      <div class="footer-links-col">
        <p class="footer-heading">Info</p>
        <a href="#">About Us</a>
        <a href="#">Returns</a>
        <a href="#">Contact</a>
      </div>
      <div class="footer-social-col">
        <p class="footer-heading">Follow</p>
        <div class="footer-socials">
          <a href="#" class="social-btn"><i class="fa-brands fa-instagram"></i></a>
          <a href="#" class="social-btn"><i class="fa-brands fa-twitter"></i></a>
          <a href="#" class="social-btn"><i class="fa-brands fa-github"></i></a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 SimpleStore &mdash; Built with Django &amp; Python. Uncommon.org Bootcamp.</p>
    </div>
  </footer>

  <script>
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 20);
    });

    document.querySelectorAll('.nav-item').forEach(link => {
      if (link.href === window.location.href) {
        link.classList.add('active');
      }
    });
  </script>
</body>
</html>
